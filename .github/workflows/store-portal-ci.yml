name: store-portal CI

on:
  push:
    paths:
      - "store-portal/**"
      - ".github/workflows/store-portal-ci.yml"
  pull_request:
    paths:
      - "store-portal/**"
      - ".github/workflows/store-portal-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: store-portal/package-lock.json
      - run: npm ci
      - name: Build (型チェック・Lint を含む)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
